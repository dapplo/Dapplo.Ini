name: Build and Deploy

on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:
    branches-ignore:
      - 'gh-pages'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: read
      actions: read
      checks: write

    env:
      SOLUTION: 'Dapplo.Ini.slnx'
      BUILD_CONFIGURATION: 'Release'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION }}

    - name: Build
      run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Test
      run: dotnet test ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Pack
      run: dotnet pack ${{ env.SOLUTION }} --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output artifacts

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        retention-days: 1
        path: artifacts/**/*

  deploy:
    runs-on: windows-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      # NuGet trusted publishing: the job's OIDC token is exchanged for a short-lived API key
      id-token: write

    environment:
      name: NuGet

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: artifacts

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # Trusted publishing (https://learn.microsoft.com/nuget/nuget-org/trusted-publishing): needs a trusted publishing
    # policy on nuget.org for this repository, workflow file (build.yml) and environment (NuGet), and the repository
    # variable NUGET_USER with the nuget.org user name (profile name, not the e-mail address) that owns the policy.
    - name: NuGet login (OIDC)
      id: nuget-login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Push to NuGet
      shell: pwsh
      env:
        NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
      run: |
        $packages = Get-ChildItem -Path artifacts -Filter "*.nupkg" | Where-Object { $_.Name -notlike "*.symbols.nupkg" }
        if ($packages.Count -eq 0) {
          Write-Host "No packages found to publish"
          exit 0
        }

        $failed = 0
        foreach ($package in $packages) {
          Write-Host "Pushing $($package.Name)..."
          # --skip-duplicate: a version that is already on nuget.org is not an error
          dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY --skip-duplicate
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to push $($package.Name)"
            $failed++
          }
        }

        if ($failed -gt 0) {
          Write-Error "Failed to push $failed package(s)"
          exit 1
        }
